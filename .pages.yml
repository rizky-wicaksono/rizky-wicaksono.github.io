      - name: sentence
        label: 'Kalimat / Sentence'
        type: string
        description: 'Wajib berisi [name], [intent], [topic] dan [email]. / Must contain [name], [intent], [topic] and [email].'
      - name: intent
        label: 'Pilihan [intent] / [intent] options'
        type: string
        list: true
      - name: topic
        label: 'Pilihan [topic] / [topic] options'
        type: string
        list: true
      - name: name_label
        label: 'Label nama untuk pembaca layar / Name label (screen readers)'
        type: string
      - name: name_hint
        label: 'Teks contoh nama / Name placeholder'
        type: string
      - name: intent_label
        label: 'Label [intent] untuk pembaca layar / [intent] label (screen readers)'
        type: string
      - name: topic_label
        label: 'Label [topic] untuk pembaca layar / [topic] label (screen readers)'
        type: string
      - name: email_label
        label: 'Label email untuk pembaca layar / Email label (screen readers)'
        type: string
      - name: email_hint
        label: 'Teks contoh email / Email placeholder'
        type: string
      - name: send
        label: 'Tombol kirim / Send button'
        type: string
      - name: copy
        label: 'Tombol salin / Copy button'
        type: string
      - name: opening
        label: 'Pesan setelah tombol kirim / After the send button'
        type: string
        description: 'Muncul kalau aplikasi email tidak terbuka. {address} = alamat email / Shown in case no email app opens. {address} = email address'
      - name: copied
        label: 'Pesan setelah disalin / After copying'
        type: string
        description: '{address} = alamat email / email address'
      - name: copy_failed
        label: 'Pesan jika gagal menyalin / If copying fails'
        type: string
        description: '{address} = alamat email / email address'
      - name: direct
        label: 'Baris email langsung / Direct email line'
        type: string
        description: '{address} = email, {linkedin} = tautan LinkedIn / LinkedIn link'
      - name: subject
        label: 'Subjek email / Email subject'
        type: string
        description: 'Boleh pakai / You can use {name}, {intent}, {topic}'
      - name: name_error
        label: 'Error: nama kosong / Name missing'
        type: string
      - name: email_error
        label: 'Error: email kosong / Email missing'
        type: string
      - name: email_invalid
        label: 'Error: email salah format / Email looks wrong'
        type: string
  - name: cases
    label: Studi kasus / Case studies
    type: collection
    path: content/cases
    format: yaml
    filename:
      template: '{primary}.yml'
      field: create
    view:
      primary: name
      fields:
      - name
      - year
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
    - name: name
      label: Nama klien / Client name
      type: string
      required: true
    - name: title_name
      label: Nama pendek untuk judul halaman / Short name for page title
      type: string
      description: Opsional. Kosongkan untuk memakai nama klien. / Optional; leave empty to use the client name.
    - name: order
      label: Urutan / Order
      type: number
      description: 1 tampil pertama. / 1 comes first.
      required: true
    - name: desc
      label: Deskripsi di Google / Meta description
      type: text
      description: Sekitar 155 karakter. / About 155 characters.
    - name: industry
      label: Industri / Industry
      type: string
    - name: year
      label: Tahun / Year
      type: string
    - name: role
      label: Lingkup kerja / Scope
      type: string
    - name: teaser
      label: Kalimat di kartu beranda / Home page card line
      type: string
    - name: stats
      label: Angka utama / Key stats
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{number} {label}'
      fields:
      - name: number
        label: Angka / Number
        type: string
      - name: label
        label: Keterangan / Caption
        type: string
    - name: background
      label: Latar belakang / Background
      type: text
    - name: challenge
      label: Tantangan / Challenge
      type: text
    - name: result
      label: Hasil / Result
      type: text
    - name: bullets
      label: Poin hasil / Result bullets
      type: text
      list: true
    - name: coverage
      label: Liputan pilihan / Featured coverage
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{outlet}: {headline}'
      fields:
      - name: outlet
        label: Media / Outlet
        type: string
      - name: headline
        label: Judul artikel / Headline
        type: text
      - name: url
        label: Tautan artikel / Article link
        type: string
        description: Kosongkan bila tidak ada tautan. / Leave empty if there is no link.
      - name: image
        label: Gambar pratinjau / Preview image
        type: string
        description: URL gambar dari artikel, atau assets/img/nama-file.jpg. / Image URL from the article, or assets/img/file.jpg.
    - name: card_id
      label: Kartu beranda Bahasa Indonesia / Indonesian home page card
      type: object
      description: Studi kasus sendiri hanya dalam bahasa Inggris. / The case study page itself is English only.
      fields:
      - name: industry
        label: Industri
        type: string
      - name: year
        label: Tahun
        type: string
      - name: teaser
        label: Kalimat di kartu
        type: string
  - name: tools
    label: Tools
    type: file
    path: content/tools.yml
    format: yaml
    fields:
    - name: tools
      label: Alat / Tools
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name}'
      fields:
      - name: name
        label: Nama alat / Tool name
        type: string
        required: true
      - name: url
        label: Alamat / Address
        type: string
        description: Contoh / e.g. /file-shrinker/
      - name: slug
        label: ID alat / Tool ID
        type: string
        description: Huruf kecil dan tanda hubung. / Lowercase with hyphens.
      - name: icons
        label: Ikon / Icons
        type: string
        description: 'Pilih dari: pdf, video, audio. / Choose from: pdf, video, audio.'
        list: true
      - name: guides
        label: Tautan panduan / Guide links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
        - name: label
          label: Teks tautan / Link text
          type: string
        - name: guide
          label: Panduan / Guide
          type: string
          description: Nama file panduan bahasa Inggris tanpa .md. / English guide file name without .md.
      - name: english
        label: Teks bahasa Inggris / English text
        type: object
        fields:
        - name: kinds
          label: Jenis file / File types
          type: string
        - name: desc
          label: Penjelasan / Description
          type: text
        - name: tags
          label: Label / Tags
          type: string
          list: true
      - name: indonesian
        label: Teks Bahasa Indonesia / Indonesian text
        type: object
        fields:
        - name: kinds
          label: Jenis file
          type: string
        - name: desc
          label: Penjelasan
          type: text
        - name: tags
          label: Label
          type: string
          list: true
  - name: guides_en
    label: Guides (English)
    type: collection
    path: content/guides/en
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, date]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: short
        label: Short title (browser tab and search results)
        type: string
        required: true
      - name: desc
        label: Description (search results, about 155 characters)
        type: text
        required: true
      - name: summary
        label: In short (summary box at the top)
        type: text
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: minutes
        label: Reading time (minutes)
        type: number
        required: true
      - name: body
        label: Article
        description: "Each section starts with a Heading 2. A paragraph with only [[steps]] marks where the numbered steps go."
        type: rich-text
        options:
          format: html
          media: images
      - name: steps_title
        label: Steps heading
        description: Leave empty if the article has no numbered steps.
        type: string
      - name: steps
        label: Steps
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step
            type: string
          - name: text
            label: Text (HTML allowed for links)
            type: text
      - name: faq
        label: FAQ
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{q}"
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
      - name: sources
        label: Sources
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Source name
            type: string
          - name: url
            label: Link
            type: string
      - name: tool
        label: Tool box (tool how-tos only)
        type: object
        fields:
          - name: name
            label: Tool name
            type: string
          - name: url
            label: Tool link
            type: string
          - name: kind
            label: Kind (pdf, video or audio)
            type: string
          - name: pitch
            label: One-line pitch
            type: text
      - name: key
        label: Translation key
        description: The English file name (without .md). The English and Indonesian versions of one article must share it.
        type: string
        required: true
      - name: order
        label: Order
        description: Position in the guide lists (1 comes first). Use the same number in both languages.
        type: number
        required: true
