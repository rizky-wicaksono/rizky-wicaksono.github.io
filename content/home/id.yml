eng_label: Rekayasa public relations
eng_h2: PR yang belajar membangun dengan AI
eng_chip: 'Coba alat pertama: File Shrinker'
eng_p:
- Saya tidak bisa coding, dan saya tidak mengklaim demikian. Yang saya miliki adalah rasa ingin tahu dan kemampuan yang cukup untuk memahami cara sesuatu dibangun, belajar lebih jauh, dan mencoba, dengan AI yang mengerjakan bagian beratnya.
- 'Saya sedang menuju peran yang sudah ada di pemasaran tapi belum di PR: <strong>public relations engineer</strong>. Tujuannya sederhana: memakai AI untuk memangkas bagian PR yang repetitif, seperti pemantauan media, draf pertama, penyusunan daftar media, dan pelaporan, supaya lebih banyak waktu untuk strategi dan hubungan.'
eng_list:
- Belajar cara kerja alat AI dan kode, cukup untuk memahami dan mencobanya
- Mengubah playbook PR saya menjadi alat kecil yang bisa dipakai ulang, dengan bantuan AI
- Menulis tentang apa yang berhasil dan apa yang tidak
eng_end: Terbuka untuk kolaborasi di bidang PR dan AI, undangan berbicara, dan tim komunikasi yang ingin mengotomatiskan bagian yang membosankan.
