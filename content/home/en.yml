see: "See "
services:
  - title: Integrated marketing communications
    text: PR, social media, branding, website and documentation run as one plan. At
      JAFF Market that plan reached 8.5M social views and 68K+ website visitors.
    case: jaff-market
    icon: marcomm
  - title: Media relations
    text: Press releases, interviews and media partnerships. DAIKIN’s launch earned
      334+ coverages, and JAFF Market’s 663 came from 9 press releases and 13
      interviews.
    case: daikin-indonesia
    icon: media
  - title: Brand storytelling
    text: Brand refreshes told through the consumer brands people already know, like
      Guardian and IKEA for DFI Retail.
    case: dfi-retail-nusantara
    icon: story
  - title: Corporate communications
    text: Executive voice and stakeholder messaging for regulated companies, such as
      interviews and op-eds for CLIK.
    case: crif-clik
    icon: corp
  - title: Launch and event communications
    text: "Press conferences and debut events: three for DAIKIN’s factory launch,
      and a youth orchestra’s first public concert."
    case: trinity-entertainment-group
    icon: event
  - title: Content strategy
    text: Annual social and content plans that make technical topics easy to read,
      like agricultural biotechnology for CropLife.
    case: croplife-indonesia
    icon: content
