about_p:
  - A storyteller at heart and a strategist by trade, I’ve spent 5+ years
    helping brands grow their voice through <strong>Public Relations</strong>
    and <strong>Marketing Communications</strong>.
  - I specialize in connecting brands with their audiences through <strong>media
    relations, brand storytelling, and integrated campaigns</strong> that make
    people stop, read, and remember.
  - Right now I’m handling Netflix Indonesia, Suzuki Indonesia and Shell
    Indonesia. Past work spans entertainment, technology, automotive,
    transportation, manufacturing, retail, consumer, and corporate, and I’m open
    to any industry.
mc_label: Marketing communications
mc_h2: One plan across PR, social, brand and web
mc_lead: At JAFF Market, Indonesia’s first film market, Rizky Wicaksono led
  integrated marketing communications across public relations, social media,
  branding, website and documentation, with 36 core team members and 26
  volunteers.
