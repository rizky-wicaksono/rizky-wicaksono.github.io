eng_label: Public relations engineering
eng_h2: PR that learns to build with AI
eng_chip: "Try the first tool: File Shrinker"
eng_p:
  - I can’t code, and I’m not claiming to. What I do have is enough curiosity
    and skill to understand how things are built, learn more, and try, with AI
    doing the heavy lifting.
  - "I’m working toward a role marketing already has and PR doesn’t yet: the
    <strong>public relations engineer</strong>. The goal is simple: use AI to
    cut the repetitive parts of PR, such as media monitoring, first drafts,
    list-building and reporting, so more time goes to strategy and
    relationships."
eng_list:
  - Learning how AI tools and code work, enough to understand and try them
  - Turning my PR playbooks into small, reusable tools, with AI’s help
  - Writing about what works and what doesn’t
eng_end: Open to collaborations on PR and AI, speaking, and comms teams that
  want to automate the boring parts.
