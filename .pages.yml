# Pages CMS (https://pagescms.org) configuration: lets you edit the guides in a browser.
# Saving in Pages CMS commits to the repo; the "Build and deploy site" workflow then rebuilds the site.
media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
    categories: [image]

content:
  - name: guides_en
    label: Guides (English)
    type: collection
    path: content/guides/en
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, date]
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: short
        label: Short title (browser tab and search results)
        type: string
        required: true
      - name: desc
        label: Description (search results, about 155 characters)
        type: text
        required: true
      - name: summary
        label: In short (summary box at the top)
        type: text
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: minutes
        label: Reading time (minutes)
        type: number
        required: true
      - name: body
        label: Article
        description: "Each section starts with a Heading 2. A paragraph with only [[steps]] marks where the numbered steps go."
        type: rich-text
        options:
          format: html
          media: images
      - name: steps_title
        label: Steps heading
        description: Leave empty if the article has no numbered steps.
        type: string
      - name: steps
        label: Steps
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step
            type: string
          - name: text
            label: Text (HTML allowed for links)
            type: text
      - name: faq
        label: FAQ
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{q}"
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
      - name: sources
        label: Sources
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Source name
            type: string
          - name: url
            label: Link
            type: string
      - name: tool
        label: Tool box (tool how-tos only)
        type: object
        fields:
          - name: name
            label: Tool name
            type: string
          - name: url
            label: Tool link
            type: string
          - name: kind
            label: Kind (pdf, video or audio)
            type: string
          - name: pitch
            label: One-line pitch
            type: text
      - name: key
        label: Translation key
        description: The English file name (without .md). The English and Indonesian versions of one article must share it.
        type: string
        required: true
      - name: order
        label: Order
        description: Position in the guide lists (1 comes first). Use the same number in both languages.
        type: number
        required: true
