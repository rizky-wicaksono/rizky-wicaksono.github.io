about_p:
- Saya seorang pencerita sekaligus ahli strategi. Selama 5+ tahun saya membantu brand mengembangkan suaranya lewat <strong>Public Relations</strong> dan <strong>Marketing Communications</strong>.
- Saya berfokus menghubungkan brand dengan audiensnya lewat <strong>media relations, brand storytelling, dan kampanye terpadu</strong> yang membuat orang berhenti, membaca, dan mengingat.
- Saat ini saya menangani Netflix Indonesia, Suzuki Indonesia, dan Shell Indonesia. Pengalaman saya mencakup hiburan, teknologi, otomotif, transportasi, manufaktur, ritel, konsumen, dan korporasi, dan saya terbuka untuk industri apa pun.
